[package]
name = "rs-dotfiles"
version = "0.1.0"
edition = "2024"

[dependencies]
# Error handling
anyhow = "1.0"
# CLI parsing
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"
# Terminal colors
colored = "3"
# Directory path helpers
directories = "6"
# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Cross-platform symlink handling
symlink = "0.1"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.3"
predicates = "3.1.4"
tempfile = "3.8"
